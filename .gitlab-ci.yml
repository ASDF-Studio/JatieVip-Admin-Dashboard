stages:
  - runprod

run_prod:
  only:
    - production
  stage: runprod
  script:
    - cp $ENV_PROD .env
    - docker build -t movefit  .
    - docker ps --quiet --filter="name=movefit" | xargs --no-run-if-empty docker rm -f
    - docker run --name movefit -dt -p 80:3000 --restart always movefit:latest
    - docker system prune -f
  tags:
    - prod

